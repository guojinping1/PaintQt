<?xml version="1.0" encoding="UTF-8"?>
<!-- 给画图板做导入测试用：矩形、圆、椭圆、直线、多边形、折线、分组变换、贝塞尔路径都覆盖 -->
<svg xmlns="http://www.w3.org/2000/svg" width="500" height="400" viewBox="0 0 500 400">

  <!-- 矩形 -->
  <rect x="40" y="40" width="120" height="80" fill="none" stroke="#1E78DC" stroke-width="2"/>

  <!-- 圆 -->
  <circle cx="260" cy="80" r="45" fill="none" stroke="#DC3C3C" stroke-width="3"/>

  <!-- 椭圆 -->
  <ellipse cx="410" cy="80" rx="60" ry="35" fill="none" stroke="#3CAA3C" stroke-width="2"/>

  <!-- 直线 -->
  <line x1="40" y1="170" x2="460" y2="170" stroke="#8C50C8" stroke-width="3"/>

  <!-- 用 style="..." 写样式，颜色用颜色名 -->
  <rect x="380" y="200" width="80" height="50" style="fill:none;stroke:orange;stroke-width:3"/>

  <!-- 贝塞尔路径：C 三次 + Q 二次 -->
  <path d="M 40 220 C 90 180 140 260 190 220 Q 230 190 270 220"
        fill="none" stroke="#3CAA3C" stroke-width="2"/>

  <!-- 多边形（五边形） -->
  <polygon points="120,360 60,310 85,240 155,240 180,310"
           fill="none" stroke="#F09600" stroke-width="2"/>

  <!-- 折线 -->
  <polyline points="230,360 260,270 290,360 320,270 350,360"
            fill="none" stroke="#000000" stroke-width="2"/>

  <!-- 分组 + 变换：平移 + 缩放 -->
  <g transform="translate(390,270) scale(0.8)">
    <rect x="0" y="0" width="80" height="60" fill="none" stroke="#DC3C3C" stroke-width="2"/>
    <circle cx="40" cy="30" r="20" fill="none" stroke="#1E78DC" stroke-width="2"/>
  </g>

</svg>
